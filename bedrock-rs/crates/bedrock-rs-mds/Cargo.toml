[package]
name = "bedrock-rs-mds"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "bedrock_rs_mds"
path = "src/lib.rs"

[dependencies]
bedrock-rs-common = { path = "../bedrock-rs-common" }
bedrock-rs-md = { path = "../bedrock-rs-md" }
bedrock-rs-md-venue = { path = "../bedrock-rs-md-venue" }
bedrock-rs-transport = { path = "../bedrock-rs-transport" }

[dev-dependencies]
bedrock-rs-md-live = { path = "../bedrock-rs-md-live" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
